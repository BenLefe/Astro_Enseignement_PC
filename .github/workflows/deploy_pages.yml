name: Compilation et Déploiement Statique Astro
on:
  repository_dispatch:
    types: [build_from_release] # Listens to the curl ping from Enseignement_PC

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du framework Astro
        uses: actions/checkout@v4

      - name: Cloner les cours depuis le dépôt de cours
        uses: actions/checkout@v4
        with:
          repository: 'BenLefe/Enseignement_PC'
          token: ${{ secrets.ASTRO_DEPLOY_TOKEN }}
          path: 'src/content/docs' # Starlight looks inside src/content/docs/ for your Markdown files !

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances d'Astro
        run: npm ci

      - name: Compiler le site statique (Build)
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Déployer sur GitHub Pages
        uses: actions/deploy-pages@v4
