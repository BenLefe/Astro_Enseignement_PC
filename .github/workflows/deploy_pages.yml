name: Compilation et Déploiement Statique Astro
on:
  push:
    branches: [main] # Kept local push active to let you test immediately !
  repository_dispatch:
    types: [build_from_release]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du framework Astro
        uses: actions/checkout@v4

      - name: Cloner les cours depuis le dépôt de cours
        uses: actions/checkout@v4
        with:
          repository: 'BenLefe/Enseignement_PC'
          token: ${{ secrets.ASTRO_DEPLOY_TOKEN }}
          path: 'src/content/docs'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # 🟩 Updated to Node 24 to match GitHub requirements !
          cache: 'npm'

      - name: Installer les dépendances d'Astro
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Compiler le site statique (Build)
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Déployer sur GitHub Pages
        uses: actions/deploy-pages@v4
