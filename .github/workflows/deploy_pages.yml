name: Compilation et Déploiement Statique Astro
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [build_from_release]

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write 
  
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du framework Astro
        uses: actions/checkout@v4

      - name: Cloner les cours depuis le dépôt de cours
        uses: actions/checkout@v4
        with:
          repository: 'BenLefe/Enseignement_PC'
          token: ${{ secrets.ASTRO_DEPLOY_TOKEN }}
          path: 'src/content/docs'

      - name: Transformer le README.md en index.md
        run: |
          if [ -f src/content/docs/README.md ]; then
            mv src/content/docs/README.md src/content/docs/index.md
          fi

      # 🟩 AUDITED: Insulates ALL local helper scripts and workflows from public builds
      - name: Nettoyer les scripts et guides locaux du dossier de compilation
        run: |
          rm -f src/content/docs/CHEATSHEET.md
          rm -f src/content/docs/make_print_grid.py
          rm -f src/content/docs/make_max_pack.py
          rm -f src/content/docs/bulk_generate_grids.py

      # 🟩 Core Asset Routing step: Relocates your book storage to Astro's public root folder
      - name: Déplacer les assets vers le dossier public d'Astro
        run: |
          if [ -d src/content/docs/asset ]; then
            mkdir -p public
            mv src/content/docs/asset public/asset
          fi

      # 🟩 AUDITED & PROVISIONED PONT AUTOMATIQUE: 
      # Selectively extracts ONLY compartmentalized asset subfolders, keeping your .md source files private!
      - name: Synchroniser les assets des chapitres pour le web
        run: |
          for level in 6eme 5eme 4eme 3eme; do
            if [ -d "src/content/docs/$level" ]; then
              mkdir -p "public/$level"
              # Find and copy only internal asset folders while completely preserving your nested layout shapes
              find "src/content/docs/$level" -type d -name "asset" | while read -r dir; do
                rel_path=${dir#src/content/docs/}
                mkdir -p "public/$rel_path"
                cp -r "$dir"/* "public/$rel_path/" 2>/dev/null || true
              done
            fi
          done

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Installer les dépendances d'Astro
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Compiler le site statique (Build)
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Déployer sur GitHub Pages
        uses: actions/deploy-pages@v4
