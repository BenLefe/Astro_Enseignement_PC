name: Compilation et Déploiement Statique Astro
on:
  push:
    branches: [main] # Keeps local push active to let you test immediately
  repository_dispatch:
    types: [build_from_release]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du framework Astro
        uses: actions/checkout@v4

      - name: Cloner les cours depuis le dépôt de cours
        uses: actions/checkout@v4
        with:
          repository: 'BenLefe/Enseignement_PC'
          token: ${{ secrets.ASTRO_DEPLOY_TOKEN }}
          path: 'src/content/docs'

      - name: Transformer le README.md en index.md
        run: |
          if [ -f src/content/docs/README.md ]; then
            mv src/content/docs/README.md src/content/docs/index.md
          fi

      # 🟩 Core Asset Routing step: Relocates your book storage to Astro's public root folder
      - name: Déplacer les assets vers le dossier public d'Astro
        run: |
          if [ -d src/content/docs/asset ]; then
            mkdir -p public
            mv src/content/docs/asset public/asset
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Installer les dépendances d'Astro
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Compiler le site statique (Build)
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Déployer sur GitHub Pages
        uses: actions/deploy-pages@v4
